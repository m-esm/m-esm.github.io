# Turned off on 2026-11-23 (MOSA-1727). Rule of 2026-11-22: nothing runs on GitHub-hosted
# runners. This repository has no ha3 runner, so the automatic triggers are removed and the
# jobs name the ha3 labels: a manual run waits for a runner instead of using hosted minutes.
# To turn it on again: Infra Ops registers an ha3 runner for this repository, then restore
# the triggers from the commit before this one.
name: Publish orbital station

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, ha3]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: [self-hosted, ha3]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish station
        id: deployment
        uses: actions/deploy-pages@v4
